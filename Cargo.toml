[workspace]
members = [
    "crates/thornado-abci",
    "crates/thornado-bitcoin",
    "crates/thornado-core",
    "crates/thornado-cli",
    "crates/thornado-node",
    "crates/thornado-store",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = "0.7"
bitcoin = { version = "0.32", features = ["serde"] }
ark-bn254 = "0.4"
ark-ff = "0.4"
ark-groth16 = "0.4"
ark-relations = "0.4"
ark-serialize = "0.4"
clap = { version = "4", features = ["derive"] }
frost-core = "3"
frost-secp256k1 = "3"
frost-rerandomized = "3"
hex = "0.4"
http = "1"
incrementalmerkletree = "0.8"
nonempty = "0.11"
orchard = "0.13.1"
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"
redb = "2"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shardtree = "0.6"
sha2 = "0.10"
tendermint-abci = "0.40"
tendermint-proto = "0.40"
thiserror = "2"
tiny-keccak = { version = "2", features = ["keccak"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = "0.5"
zcash_note_encryption = "0.4"
