[workspace]
members = [
    "crates/thornado-shielder",
    "crates/thornado-ffi",
    "crates/thornado-web-wasm",
    "crates/thornado-frost-ffi",
    "crates/thornado-bifrost-signer",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
bitcoin = { version = "0.32", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
frost-core = "=3.0.0"
frost-secp256k1 = "3"
frost-secp256k1-tr = "=3.0.0"
frost-rerandomized = "3"
futures = "0.3"
hex = "0.4"
http = "1"
libp2p = { version = "0.54", features = ["tokio", "tcp", "noise", "yamux", "dns", "macros", "identify", "ping"] }
libp2p-stream = "0.2.0-alpha"
once_cell = "1"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"
redb = "2"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasm-bindgen = "0.2"
