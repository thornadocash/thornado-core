[package]
name = "thornado-shielder"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["orchard-zcash"]
proof-tests = []
orchard-zcash = [
    "dep:incrementalmerkletree",
    "dep:nonempty",
    "dep:orchard",
    "dep:shardtree",
    "dep:zcash_note_encryption",
]

[dependencies]
bitcoin.workspace = true
hex.workspace = true
incrementalmerkletree = { workspace = true, optional = true }
nonempty = { workspace = true, optional = true }
orchard = { workspace = true, optional = true }
rand_chacha.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shardtree = { workspace = true, optional = true }
thiserror.workspace = true
zcash_note_encryption = { workspace = true, optional = true }
