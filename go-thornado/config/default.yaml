########################################################################################
# Bifrost
########################################################################################
# trunk-ignore-all(codespell/misspelled)
bifrost:
  # leveldb defaults to start, plus 10 bit per key filter
  observer_leveldb: &default-leveldb
    filter_bits_per_key: 10
    compaction_table_size_multiplier: 1
    write_buffer: 4194304
    block_cache_capacity: 8388608
    compact_on_init: false
  observer_workers: 0

  metrics:
    enabled: true
    pprof_enabled: false
    listen_port: 9000
    read_timeout: 30s
    write_timeout: 30s
    chains:
      - BTC
  thornado:
    chain_id: thornado
    chain_host: localhost:1317
    chain_rpc: ""
    chain_ebifrost: localhost:50051
    chain_home_folder: ""
    signer_name: ""
  attestation_gossip:
    observe_reconcile_interval: 15s
    late_observe_timeout: 5m
    non_quorum_timeout: 10h
    min_time_between_attestations: 30s
    ask_peers: 10
    ask_peers_delay: 5s
    max_batch_size: 100
    batch_interval: 2s
    peer_timeout: 20s
    peer_concurrent_sends: 4
    peer_concurrent_receives: 5
  signer:
    backup_keyshares: true
    signer_db_path: /var/data/bifrost/signer_db
    retry_interval: 2s
    reschedule_buffer_blocks: 150 # 15 minutes
    block_scanner:
      chain_id: thornado
      start_block_height: 0
      block_retry_interval: 10s
      block_height_discover_back_off: 5s
      block_scan_processors: 1
      start_block: "0"
      http_request_timeout: 30s
      http_request_read_timeout: 30s
      http_request_write_timeout: 30s
      max_http_request_retry: "10"
    leveldb: *default-leveldb
    auto_observe: true
    keygen_timeout: 5m
    keysign_timeout: 45s
    party_timeout: 45s
    pre_param_timeout: 5m
  frost:
    rendezvous: base
    p2p_port: 5040
    info_address: :6040
    bootstrap_peers: ""
    external_ip: ""
    max_keyshare_recover_scan_blocks: 100
  chains:
    btc: &default-chain
      disabled: false
      chain_id: BTC
      cosmos_chain_id: ""
      username: thornado
      password: password
      http_post_mode: 1
      disable_tls: 1
      parallel_mempool_scan: 5
      mempool_tx_id_cache_size: 1_000_000
      scanner_leveldb:
        <<: *default-leveldb
        compaction_table_size_multiplier: 10
        write_buffer: 20971520 # 20mb
        block_cache_capacity: 536870912 # 512mb
      min_confirmations: 0
      max_rpc_retries: 9 # about 1 min
      max_pending_nonces: 0
      authorization_bearer: ""
      utxo: &utxo
        block_cache_count: 144
        transaction_batch_size: 500
        max_mempool_batches: 10
        estimated_average_tx_size: 1000
        default_min_relay_fee_sats: 1000
        default_sats_per_vbyte: 25
        max_sats_per_vbyte: 9765 # backwards compatible with 1e8/10/1024
        min_sats_per_vbyte: 2
        min_utxo_confirmations: 1
        max_utxos_to_spend: 10
        max_mempool_ancestors: 25 # BTC limit is 25 (GetMempoolEntry ancestorcount includes the tx itself)
      block_scanner: &default-block-scanner
        max_reorg_rescan_blocks: 72 # 12h
        chain_id: BTC
        enforce_block_height: false
        block_scan_processors: 1
        block_height_discover_back_off: 5s
        observation_flexibility_blocks: 3
        block_retry_interval: 10s
        http_request_timeout: 30s
        http_request_read_timeout: 30s
        http_request_write_timeout: 30s
        max_http_request_retry: 10
        db_path: /var/data/bifrost/observer
        scan_mempool: true
        max_contract_tx_logs: 0

        # the following defaults must be defined to override with environment
        start_block_height: 0
        cosmos_grpc_host: ""
        cosmos_grpc_tls: false
        gas_cache_blocks: 0
        whitelist_tokens: []
        whitelist_cosmos_assets: []
        concurrency: 0
        prefetch_blocks: 0
        max_gas_limit: 0
        fixed_gas_rate: 0
        gas_price_resolution: 1 # 1 sats/vbyte
        max_resume_block_lag: 1h
        max_healthy_lag: 30m
        transaction_batch_size: 500

      # the following defaults must be defined to override with environment
      chain_host: ""
      chain_network: ""
      rpc_host: ""
      api_host: ""
      cosmos_grpc_host: ""
      cosmos_grpc_tls: false
      opt_to_retire: false
      solvency_blocks: 0
########################################################################################
# Thornado
########################################################################################

thornado:
  node_relay_url: https://node-relay-bot.herokuapp.com
  vault_pubkeys_cutoff_blocks: 1_000_000
  seed_nodes_endpoint: https://gateway.liquify.com/chain/thornado_api/thornado/nodes
  stagenet_admin_addresses: "sthor1gdq9qejfy33jctztqdrg5v4hvxnytmvjhduacc" # 9R official stagenet
  api:
    quote:
      recommended_min_amount_fee_multiplier: 3 # fee guidance multiplier
      max_lag: 3m
    pagination:
      default_page_size: 100
      max_page_size: 1000
  telemetry:
    penalty_points: false
    price_per_node: false

  log_filter:
    modules:
      - api-server
      - consensus
      - evidence
      - mempool
      - p2p
      - pex
      - rpc
      - rpc-server
      - txindex
      - x/bank
    messages:
      - executed block
      - commit synced

  auto_state_sync:
    enabled: false
    block_buffer: 150_000
    peers:
      - 8c25390487996c8b32e3c0b6defb56e74d337bca@thor-statesync-1.liquify.com:17146
  cosmos:
    pruning: nothing
    halt_height: 0
    min_retain_blocks: 0
    telemetry:
      enabled: false
      prometheus_retention_time: 600
    api:
      enable: true
      enabled_unsafe_cors: true
      enabled_swagger: true
      # Public API exposure should be through a Tor onion service or a local
      # reverse proxy. Validator internals stay on direct low-latency links.
      address: tcp://127.0.0.1:1317
    grpc:
      enable: false
      address: 127.0.0.1:9090
    ebifrost:
      enable: true
      address: 127.0.0.1:50051
      cache_item_ttl: 30m
    state_sync:
      snapshot_interval: 0
      snapshot_keep_recent: 2
  tendermint:
    log:
      level: info
      format: plain
    rpc:
      listen_address: "" # set dynamically to loopback; expose through Tor
      cors_allowed_origin: "*"
      experimental_subscription_buffer_size: 200
      experimental_websocket_write_buffer_size: 200
    p2p:
      listen_address: "" # set dynamically
      seeds: "" # set dynamically
      external_address: ""
      persistent_peers: ""
      addr_book_strict: false
      max_num_inbound_peers: 40
      max_num_outbound_peers: 10
      allow_duplicate_ip: true
    consensus:
      timeout_commit: 5s
      # these can be set to 1ms temporarily to recover from consensus failure faster
      timeout_propose_delta: 500ms
      timeout_prevote_delta: 500ms
      timeout_precommit_delta: 500ms
    state_sync:
      enable: false
      # Must be archive nodes. Liquify will be the trusted source by default.
      rpc_servers: https://gateway.liquify.com/chain/thornado_rpc,https://gateway.liquify.com/chain/thornado_rpc
      trust_height: 0
      trust_hash: ""
      trust_period: 360h0m0s
    instrumentation:
      prometheus: true
