[package]
name = "libgofrost"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"

[workspace]

[lib]
name = "gofrost"
crate-type = ["cdylib", "staticlib"]

[dependencies]
base64 = "0.22"
frost-core = "=3.0.0"
frost-secp256k1-tr = "=3.0.0"
hex = "0.4"
rand = "0.8"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
