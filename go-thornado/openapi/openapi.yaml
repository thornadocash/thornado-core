      parameters:
        - name: height
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: pub_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Keysign response
  /thornado/keygen/{height}/{pub_key}:
    get:
      summary: Keygen block by vault pubkey
      parameters:
        - name: height
          in: path
          required: true
          schema:
            type: integer
            format: int64
