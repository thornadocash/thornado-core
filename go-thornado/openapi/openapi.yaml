    get:
      summary: Transaction
      parameters:
        - name: tx_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction response
  /thornado/txout:
    get:
      summary: TxOut queue
      responses:
        "200":
          description: TxOut queue response
  /thornado/txout/out:
    get:
      summary: Outbound TxOut queue
      responses:
        "200":
          description: Outbound TxOut response
  /thornado/txout/internal:
    get:
      summary: Internal TxOut queue
      responses:
        "200":
          description: Internal TxOut response
  /thornado/txout/all:
    get:
      summary: All TxOut queue
      responses:
        "200":
          description: All TxOut response
  /thornado/deposit/{deposit_id}:
    get:
      summary: Deposit
      parameters:
        - name: deposit_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deposit response
