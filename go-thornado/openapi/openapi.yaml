    get:
      summary: Shielder nullifier
      parameters:
        - name: nullifier_hash
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Nullifier response
  /thornado/shielder/sync:
    get:
      summary: Shielder sync
      responses:
        "200":
          description: Shielder sync response
  /thornado/shielder/redeem/quote/{amount_sats}:
    get:
      summary: Shielder redeem quote
      parameters:
        - name: amount_sats
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Redeem quote response
  /thornado/fees:
    get:
      summary: Fee pool
      responses:
        "200":
          description: Fee pool response
  /thornado/deposit/session/{owner}:
    get:
      summary: Deposit session
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session response
  /thornado/bond/{node_pub_key}:
    get:
      summary: Node bond
      parameters:
        - name: node_pub_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bond response
  /thornado/node/auction/{auction_id}:
    get:
      summary: Node slot auction
      parameters:
        - name: auction_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Auction response
  /thornado/node/auctions:
    get:
      summary: Node slot auctions
      responses:
        "200":
          description: Auctions response
  /thornado/node/bid/{bid_id}:
    get:
      summary: Node slot bid
      parameters:
        - name: bid_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bid response
  /thornado/node/auction/{auction_id}/bids:
    get:
      summary: Node slot auction bids
      parameters:
        - name: auction_id
