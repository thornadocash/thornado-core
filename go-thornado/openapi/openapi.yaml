openapi: 3.0.3
info:
  title: Thornado API
  description: Thornado REST API.
  version: 0.1.0
paths:
  /thornado/ping:
    get:
      summary: Ping
      responses:
        "200":
          description: Pong
  /thornado/account/{address}:
    get:
      summary: Account
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account response
  /thornado/balances/{address}:
    get:
      summary: Balances
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Balances response
  /thornado/vaults/base:
    get:
      summary: Base vaults
      responses:
        "200":
          description: Base vault response
  /thornado/vaults/pubkeys:
    get:
      summary: Vault pubkeys
      responses:
        "200":
          description: Vault pubkeys response
  /thornado/vault/{pub_key}:
    get:
      summary: Vault
      parameters:
        - name: pub_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vault response
  /thornado/tx/{hash}:
    get:
      summary: Transaction
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction response
  /thornado/txout:
    get:
      summary: TxOut queue
      parameters:
        - name: height
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: TxOut queue response
  /thornado/config:
    get:
      summary: Config values
      responses:
        "200":
          description: Config response
  /thornado/config/defaults:
    get:
      summary: Config defaults
      responses:
        "200":
          description: Config defaults response
  /thornado/version:
    get:
      summary: Version
      responses:
        "200":
          description: Version response
  /thornado/block:
    get:
      summary: Latest block
      responses:
        "200":
          description: Block response
  /thornado/block/{height}:
    get:
      summary: Block by height
      parameters:
        - name: height
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Block response
  /thornado/lastblock:
    get:
      summary: Last observed blocks
      responses:
        "200":
          description: Last block response
  /thornado/deposit/{deposit_id}:
    get:
      summary: Deposit
      parameters:
        - name: deposit_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deposit response
  /thornado/fees:
    get:
      summary: Fee pool
      responses:
        "200":
          description: Fee pool response
  /thornado/session/{owner}:
    get:
      summary: Deposit session
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session response
  /thornado/bond/{node_pub_key}:
    get:
      summary: Node bond
      parameters:
        - name: node_pub_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bond response
  /thornado/node/auction/{auction_id}:
    get:
      summary: Node slot auction
      parameters:
        - name: auction_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Auction response
  /thornado/node/bid/{bid_id}:
    get:
      summary: Node slot bid
      parameters:
        - name: bid_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bid response
  /thornado/deposit/address/{address}:
    get:
      summary: Deposit address mapping
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deposit address response
  /thornado/fee/entitlement/{node_pub_key}:
    get:
      summary: Node fee entitlement
      parameters:
        - name: node_pub_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fee entitlement response
  /thornado/tss/keygen:
    get:
      summary: TSS keygen metrics
      responses:
        "200":
          description: TSS keygen response
  /thornado/tss/keysign:
    get:
      summary: TSS keysign metrics
      responses:
        "200":
          description: TSS keysign response
