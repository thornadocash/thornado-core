openapi: 3.0.3
info:
  title: Thornado API
  description: Thornado REST API.
  version: 0.1.0
paths:
  /auth/accounts/{address}:
    get:
      summary: Account
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account response
  /thornado/node/{address}:
    get:
      summary: Node by address
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Node response
  /thornado/nodes:
    get:
      summary: Nodes
      responses:
        "200":
          description: Nodes response
  /thornado/nodes/metrics:
    get:
      summary: Node metrics
      responses:
        "200":
          description: Node metrics response
  /thornado/node/slot/{slot}:
    get:
      summary: Node slot
      parameters:
        - name: slot
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Node slot response
  /thornado/config:
    get:
      summary: Config values
      responses:
        "200":
          description: Config response
  /thornado/config/nodes_all:
    get:
      summary: All node config values
      responses:
        "200":
          description: All node config response
  /thornado/config/nodes:
    get:
      summary: Node config values
      responses:
        "200":
          description: Node config response
  /thornado/config/node/{address}:
    get:
      summary: Config values for node
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Node config response
  /thornado/version:
    get:
      summary: Version
      responses:
        "200":
          description: Version response
  /thornado/invariant/{path}:
    get:
      summary: Invariant
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invariant response
  /thornado/invariants:
    get:
      summary: Invariants
      responses:
        "200":
          description: Invariants response
  /thornado/balance/module/{name}:
    get:
      summary: Module balance
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Module balance response
  /thornado/config/defaults:
    get:
      summary: Config defaults
      responses:
        "200":
          description: Config defaults response
  /thornado/lastblock:
    get:
      summary: Last observed blocks
      responses:
        "200":
          description: Last block response
  /thornado/network_fee:
    get:
      summary: BTC network fee
      responses:
        "200":
          description: Network fee response
  /thornado/vault/{pub_key}:
    get:
      summary: Vault
      parameters:
        - name: pub_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vault response
  /thornado/vaults/base:
    get:
      summary: Base vaults
      responses:
        "200":
          description: Base vault response
  /thornado/vaults/pubkeys:
    get:
      summary: Vault pubkeys
      responses:
        "200":
          description: Vault pubkeys response
  /thornado/vaults/solvency:
    get:
      summary: Vault solvency
      responses:
        "200":
          description: Vault solvency response
