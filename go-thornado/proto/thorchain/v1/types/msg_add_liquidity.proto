syntax = "proto3";
package types;

option go_package = "github.com/thornadocash/go-thornado/x/thorchain/types";

import "common/common.proto";
import "gogoproto/gogo.proto";

message MsgAddLiquidity {
  common.Tx tx = 1 [ (gogoproto.nullable) = false ];
  common.Asset asset = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) = "github.com/thornadocash/go-thornado/common.Asset"
  ];
  string asset_amount = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string rune_amount = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string rune_address = 5
      [ (gogoproto.casttype) =
            "github.com/thornadocash/go-thornado/common.Address" ];
  string asset_address = 6
      [ (gogoproto.casttype) =
            "github.com/thornadocash/go-thornado/common.Address" ];
  string affiliate_address = 7
      [ (gogoproto.casttype) =
            "github.com/thornadocash/go-thornado/common.Address" ];
  string affiliate_basis_points = 8 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  bytes signer = 9 [ (gogoproto.casttype) =
                         "github.com/cosmos/cosmos-sdk/types.AccAddress" ];
}
