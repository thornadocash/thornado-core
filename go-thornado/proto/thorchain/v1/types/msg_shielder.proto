syntax = "proto3";
package types;

option go_package = "github.com/thornadocash/go-thornado/x/thorchain/types";

import "amino/amino.proto";
import "gogoproto/gogo.proto";

message MsgShielderRegisterPow {
  option (amino.name) = "thorchain/MsgShielderRegisterPow";

  string pow_token = 1;
  bytes signer = 2 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (amino.encoding) = "bech32"
  ];
  string operator_pub_key = 3;
  string validator_pub_key = 4;
}

message MsgShielderRegisterPowResponse {
  string deposit_address = 1;
  string vault_pub_key = 2;
  uint64 deposit_path_index = 3;
  string bid_id = 4;
}

message MsgShielderPostCommitments {
  option (amino.name) = "thorchain/MsgShielderPostCommitments";

  string deposit_id = 1;
  repeated string commitments = 2;
  bytes signer = 3 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (amino.encoding) = "bech32"
  ];
}

message MsgShielderPostCommitmentsResponse {
  string deposit_id = 1;
  string status = 2;
}

message MsgShielderSettleDeposit {
  option (amino.name) = "thorchain/MsgShielderSettleDeposit";

  string deposit_id = 1;
  bytes signer = 2 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (amino.encoding) = "bech32"
  ];
}

message MsgShielderSettleDepositResponse {
  string deposit_id = 1;
  string status = 2;
  string settlement = 3;
}

message MsgShielderRequestWithdrawal {
  option (amino.name) = "thorchain/MsgShielderRequestWithdrawal";

  bytes proof = 1;
  bytes public = 2;
  bytes signer = 3 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (amino.encoding) = "bech32"
  ];
}

message MsgShielderRequestWithdrawalResponse {
  string withdrawal_id = 1;
  string status = 2;
}

message MsgShielderSplitFees {
  option (amino.name) = "thorchain/MsgShielderSplitFees";

  string validator_pub_key = 1;
  bytes operator_signature = 2;
  repeated string commitments = 3;
  repeated string fee_note_pub_keys = 4;
  bytes signer = 5 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (amino.encoding) = "bech32"
  ];
}

message MsgShielderSettleFees {
  option (amino.name) = "thorchain/MsgShielderSettleFees";

  string validator_pub_key = 1;
  bytes operator_signature = 2;
  bytes signer = 3 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (amino.encoding) = "bech32"
  ];
}

message MsgShielderSplitFeesResponse {
  string deposit_id = 1;
  uint64 amount_sats = 2;
  string status = 3;
}

message MsgNodeSlotAuctionCreate {
  option (amino.name) = "thorchain/MsgNodeSlotAuctionCreate";

  string validator_pub_key = 1;
  uint64 reserve_sats = 2;
  int64 expiry_height = 3;
  bytes signer = 4 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (amino.encoding) = "bech32"
  ];
}

message MsgNodeSlotAuctionCreateResponse {
  string auction_id = 1;
}

message MsgNodeSlotAuctionBidPow {
  option (amino.name) = "thorchain/MsgNodeSlotAuctionBidPow";

  string auction_id = 1;
  string pow_token = 2;
  string operator_pub_key = 3;
  string validator_pub_key = 4;
  bytes signer = 5 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (amino.encoding) = "bech32"
  ];
}

message MsgNodeSlotAuctionSelectBid {
  option (amino.name) = "thorchain/MsgNodeSlotAuctionSelectBid";

  string auction_id = 1;
  string bid_id = 2;
  bytes signer = 3 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (amino.encoding) = "bech32"
  ];
}

message MsgNodeSlotAuctionSplit {
  option (amino.name) = "thorchain/MsgNodeSlotAuctionSplit";

  string auction_id = 1;
  string bid_id = 2;
  repeated string commitments = 3;
  bytes signer = 4 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (amino.encoding) = "bech32"
  ];
}
