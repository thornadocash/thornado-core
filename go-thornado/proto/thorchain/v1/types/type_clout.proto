syntax = "proto3";
package types;

option go_package = "github.com/thornadocash/go-thornado/x/thorchain/types";

import "gogoproto/gogo.proto";

message SwapperClout {
  string address = 1 [ (gogoproto.casttype) =
                           "github.com/thornadocash/go-thornado/common.Address" ];
  string score = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string reclaimed = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string spent = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  int64 last_spent_height = 5;
  int64 last_reclaim_height = 6;
}
