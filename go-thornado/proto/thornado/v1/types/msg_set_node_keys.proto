syntax = "proto3";
package types;

option go_package = "github.com/thornadocash/go-thornado/x/thornado/types";

import "common/common.proto";
import "gogoproto/gogo.proto";
import "amino/amino.proto";

message MsgSetNodeKeys {
  option (amino.name) = "thornado/MsgSetNodeKeys";

  common.PubKeySet pub_key_set_set = 1 [ (gogoproto.nullable) = false ];
  string node_cons_pub_key = 2;
  bytes signer = 3 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (amino.encoding) = "bech32"
  ];
}
