syntax = "proto3";
package types;

option go_package = "github.com/thornadocash/go-thornado/x/thornado/types";
option (gogoproto.goproto_getters_all) = false;

import "types/type_blame.proto";
import "common/common.proto";
import "gogoproto/gogo.proto";
import "amino/amino.proto";

message MsgTssKeysignFail {
  option (amino.name) = "thornado/TssKeysignFail";

  string id = 1 [ (gogoproto.customname) = "ID" ];
  int64 height = 2;
  Blame blame = 3 [ (gogoproto.nullable) = false ];
  repeated common.Coin coins = 5 [
    (gogoproto.castrepeated) = "github.com/thornadocash/go-thornado/common.Coins",
    (gogoproto.nullable) = false
  ];
  string pub_key = 6 [ (gogoproto.casttype) =
                           "github.com/thornadocash/go-thornado/common.PubKey" ];
  bytes signer = 7 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (amino.encoding) = "bech32"
  ];
}
