syntax = "proto3";
package types;

option go_package = "github.com/thornadocash/go-thornado/x/thornado/types";

import "types/type_observed_tx.proto";
import "gogoproto/gogo.proto";
import "common/common.proto";

message MsgOutboundTx {
  common.ObservedTx tx = 1 [ (gogoproto.nullable) = false ];
  string in_tx_id = 2 [
    (gogoproto.casttype) = "github.com/thornadocash/go-thornado/common.TxID",
    (gogoproto.customname) = "InTxID"
  ];
  bytes signer = 3 [ (gogoproto.casttype) =
                         "github.com/cosmos/cosmos-sdk/types.AccAddress" ];
}
