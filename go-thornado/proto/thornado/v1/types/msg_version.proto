syntax = "proto3";
package types;

option go_package = "github.com/thornadocash/go-thornado/x/thornado/types";
option (gogoproto.goproto_getters_all) = false;

import "gogoproto/gogo.proto";
import "amino/amino.proto";

message MsgSetVersion {
  option (amino.name) = "thornado/MsgSetVersion";

  string version = 1;
  bytes signer = 2 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (amino.encoding) = "bech32"
  ];
}
