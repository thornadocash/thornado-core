syntax = "proto3";
package types;

option go_package = "github.com/thornadocash/go-thornado/x/thornado/types";

import "types/query_tx.proto";

message QueryDepositRequest {
  string deposit_id = 1;
  string height = 2;
}

message QueryDepositResponse {
  string deposit_id = 1;
  string owner = 2;
  uint64 amount_sats = 3;
  string deposit_address = 4;
  string vault_pub_key = 5;
  uint64 deposit_path_index = 6;
  string status = 7;
  string settlement = 8;
  string auction_id = 9;
  string node_pub_key = 10;
  uint64 node_slot = 11;
  bool bond_confirmed = 12;
  uint64 commitment_count = 13;
  string inbound_tx_id = 14;
  int64 btc_confirmations = 15;
  int64 btc_confirmations_required = 16;
  int64 btc_observed_height = 17;
  int64 created_height = 18;
  int64 expires_at_height = 19;
  int64 purge_at_height = 20;
  int64 refund_eligible_height = 21;
  int64 refund_queued_height = 22;
}

message QueryDepositSessionRequest {
  string owner = 1;
  string height = 2;
}

message QueryDepositSessionResponse {
  string owner = 1;
  string deposit_address = 2;
  string vault_pub_key = 3;
  uint64 deposit_path_index = 4;
  string operator_pub_key = 5;
  string node_pub_key = 6;
  string auction_id = 7;
  int64 created_height = 8;
  string status = 9;
  string deposit_id = 10;
  string inbound_tx_id = 11;
  int64 btc_confirmations = 12;
  int64 btc_confirmations_required = 13;
  int64 btc_observed_height = 14;
  int64 expires_at_height = 15;
  int64 purge_at_height = 16;
  int64 refund_eligible_height = 17;
}

message QueryVaultDepositAddressRequest {
  string address = 1;
  string height = 2;
}

message QueryVaultDepositAddressResponse {
  string address = 1;
  string vault_pub_key = 2;
  uint64 path_index = 3;
  string owner = 4;
  string operator_pub_key = 5;
  string node_pub_key = 6;
  string auction_id = 7;
  int64 created_height = 8;
  int64 expires_at_height = 9;
  int64 purge_at_height = 10;
}

message QueryDepositAddressTxsRequest {
  string address = 1;
  string height = 2;
}

message QueryDepositAddressTxsResponse {
  string address = 1;
  repeated QueryTxResponse txs = 2;
}
