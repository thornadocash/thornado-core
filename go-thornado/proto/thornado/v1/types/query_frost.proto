syntax = "proto3";
package types;

option go_package = "github.com/thornadocash/go-thornado/x/thornado/types";

import "gogoproto/gogo.proto";
import "types/type_frost_metric.proto";

option (gogoproto.marshaler_all) = true;

message QueryFrostKeygenMetricRequest {
  string pub_key = 1;
  string height = 2;
}

message QueryFrostKeygenMetricResponse { repeated FrostKeygenMetric metrics = 1; }

message QueryFrostMetricRequest { string height = 1; }

message QueryFrostMetricResponse {
  repeated FrostKeygenMetric keygen = 1 [ (gogoproto.jsontag) = "keygen" ];
  FrostKeysignMetric keysign = 2 [ (gogoproto.jsontag) = "keysign" ];
}