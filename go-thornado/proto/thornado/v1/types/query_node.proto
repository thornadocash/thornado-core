syntax = "proto3";
package types;

option go_package = "github.com/thornadocash/go-thornado/x/thornado/types";

import "gogoproto/gogo.proto";
import "common/common.proto";

option (gogoproto.marshaler_all) = true;

message QueryNodeRequest {
  string address = 1;
  string height = 2;
}

message QueryNodeResponse {
  string node_address = 1 [ (gogoproto.jsontag) = "node_address" ];
  string status = 2 [ (gogoproto.jsontag) = "status" ];
  common.PubKeySet pub_key_set = 3
      [ (gogoproto.nullable) = false, (gogoproto.jsontag) = "pub_key_set" ];
  // the consensus pub key for the node
  string node_cons_pub_key = 4
      [ (gogoproto.jsontag) = "node_cons_pub_key" ];
  // the P2PID (:6040/p2pid endpoint) of the node
  string peer_id = 5 [ (gogoproto.jsontag) = "peer_id" ];
  // the block height at which the node became active
  int64 active_block_height = 6 [ (gogoproto.jsontag) = "active_block_height" ];
  // the block height of the current provided information for the node
  int64 status_since = 7 [ (gogoproto.jsontag) = "status_since" ];
  string node_operator_address = 8
      [ (gogoproto.jsontag) = "node_operator_address" ];
  // current node bond
  string total_bond = 9 [ (gogoproto.jsontag) = "total_bond" ];
  reserved 10;
  // the set of vault public keys of which the node is a member
  repeated string signer_membership = 11
      [ (gogoproto.jsontag) = "signer_membership" ];
  bool requested_to_leave = 12 [ (gogoproto.jsontag) = "requested_to_leave" ];
  // indicates whether the node has been forced to leave by the network,
  // typically via ban
  bool forced_to_leave = 13 [ (gogoproto.jsontag) = "forced_to_leave" ];
  int64 leave_height = 14 [ (gogoproto.jsontag) = "leave_height" ];
  // the currently set version of the node
  string ip_address = 15 [ (gogoproto.jsontag) = "ip_address" ];
  string version = 16 [ (gogoproto.jsontag) = "version" ];
  // the accumulated penalty points, reset at churn but excessive penalty points may
  // carry over
  int64 penalty_points = 17 [ (gogoproto.jsontag) = "penalty_points" ];
  NodeJail jail = 18 [ (gogoproto.jsontag) = "jail" ];
  reserved 19;
  // the last observed heights for all chain by the node
  repeated ChainHeight observe_chains = 20
      [ (gogoproto.jsontag) = "observe_chains" ];
  NodePreflightStatus preflight_status = 21
      [ (gogoproto.jsontag) = "preflight_status" ];
  // if the node operator has placed the node in maintenance or not
  bool maintenance = 22 [ (gogoproto.jsontag) = "maintenance" ];
  int64 missing_blocks = 23 [ (gogoproto.jsontag) = "missing_blocks" ];
}

message QueryNodesRequest { string height = 1; }

message QueryNodesResponse { repeated QueryNodeResponse nodes = 1; }

message QueryNodeMetricsRequest { string height = 1; }

message QueryNodeMetricsResponse {
  uint64 next_slot = 1;
  uint64 next_slot_bond_required_sats = 2;
  uint64 bond_start_amount_sats = 3;
  uint64 bond_slot_increment_sats = 4;
  uint64 active_slots = 5;
  uint64 standby_slots = 6;
  uint64 sold_slots = 7;
  uint64 pending_bond_sats = 8;
  uint64 confirmed_bond_sats = 9;
}

message QueryNodeSlotRequest {
  uint64 slot = 1;
  string height = 2;
}

message QueryNodeSlotResponse { QueryNodeBondResponse bond = 1; }

message QueryNodeBondRequest {
  string node_pub_key = 1;
  string height = 2;
}

message QueryNodeBondResponse {
  string node_pub_key = 1;
  string operator_pub_key = 2;
  string node_address = 3;
  uint64 slot = 4;
  uint64 pending_sats = 5;
  uint64 bond_sats = 6;
  uint64 fee_debt_sats = 7;
  bool fee_share_active = 8;
  string pending_fee_deposit_id = 9;
  bool sold = 10;
  string sold_auction_id = 11;
  int64 created_height = 12;
  int64 updated_height = 13;
  string node_status = 14;
  int64 penalty_points = 15;
}

message QueryNodeSlotAuctionRequest {
  string auction_id = 1;
  string height = 2;
}

message QueryNodeSlotAuctionResponse {
  string auction_id = 1;
  string seller = 2;
  string seller_operator_pub_key = 3;
  string seller_node_pub_key = 4;
  uint64 slot = 5;
  uint64 original_bond_sats = 6;
  uint64 reserve_sats = 7;
  int64 expiry_height = 8;
  string selected_bid_id = 9;
  string status = 10;
  int64 created_height = 11;
  int64 updated_height = 12;
}

message QueryNodeSlotAuctionsRequest { string height = 1; }

message QueryNodeSlotAuctionsResponse {
  repeated QueryNodeSlotAuctionResponse auctions = 1;
}

message QueryNodeSlotBidRequest {
  string bid_id = 1;
  string height = 2;
}

message QueryNodeSlotBidResponse {
  string bid_id = 1;
  string auction_id = 2;
  string bidder = 3;
  string operator_pub_key = 4;
  string node_pub_key = 5;
  string deposit_id = 6;
  uint64 amount_sats = 7;
  bool selected = 8;
  bool settled = 9;
  int64 created_height = 10;
  int64 updated_height = 11;
}

message QueryNodeSlotAuctionBidsRequest {
  string auction_id = 1;
  string height = 2;
}

message QueryNodeSlotAuctionBidsResponse {
  repeated QueryNodeSlotBidResponse bids = 1;
}

message NodeJail {
  int64 release_height = 1;
  string reason = 2;
}

message ChainHeight {
  string chain = 1 [ (gogoproto.jsontag) = "chain" ];
  int64 height = 2 [ (gogoproto.jsontag) = "height" ];
}

message NodePreflightStatus {
  // the next status of the node
  string status = 1 [ (gogoproto.jsontag) = "status" ];
  // the reason for the transition to the next status
  string reason = 2 [ (gogoproto.jsontag) = "reason" ];
  int64 code = 3 [ (gogoproto.jsontag) = "code" ];
}
