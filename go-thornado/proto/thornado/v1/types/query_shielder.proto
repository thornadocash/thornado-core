syntax = "proto3";
package types;

option go_package = "github.com/thornadocash/go-thornado/x/thornado/types";

message QueryShielderDepositRequest {
  string deposit_id = 1;
  string height = 2;
}

message QueryShielderDepositResponse {
  string deposit_id = 1;
  string owner = 2;
  uint64 amount_sats = 3;
  string deposit_address = 4;
  string vault_pub_key = 5;
  uint64 deposit_path_index = 6;
  string status = 7;
  string settlement = 8;
  string auction_id = 9;
  string node_pub_key = 10;
  uint64 node_slot = 11;
  bool bond_confirmed = 12;
  uint64 commitment_count = 13;
}

message QueryShielderFeePoolRequest {
  string height = 1;
}

message QueryShielderFeePoolResponse {
  uint64 pending_sats = 1;
  uint64 total_slots = 2;
  uint64 fee_per_slot_share = 3;
  uint64 total_collected_sats = 4;
  uint64 total_claimed_sats = 5;
}

message QueryShielderWithdrawalRequest {
  string withdrawal_id = 1;
  string height = 2;
}

message QueryShielderWithdrawalResponse {
  string withdrawal_id = 1;
  string owner = 2;
  string nullifier_hash = 3;
  string merkle_root = 4;
  string recipient = 5;
  uint64 amount_sats = 6;
  uint64 fee_sats = 7;
  string in_hash = 8;
  string vault_pub_key = 9;
  int64 requested_height = 10;
  string status = 11;
}

message QueryShielderNullifierRequest {
  string nullifier_hash = 1;
  string height = 2;
}

message QueryShielderNullifierResponse {
  string nullifier_hash = 1;
  bool spent = 2;
  string withdrawal_id = 3;
}

message ShielderRoot {
  uint64 denomination_sats = 1;
  string root = 2;
  uint64 leaf_count = 3;
}

message QueryShielderRootsRequest { string height = 1; }

message QueryShielderRootsResponse { repeated ShielderRoot roots = 1; }

message QueryShielderWithdrawalQuoteRequest {
  uint64 amount_sats = 1;
  string height = 2;
}

message QueryShielderWithdrawalQuoteResponse {
  uint64 amount_sats = 1;
  uint64 fee_sats = 2;
  uint64 net_sats = 3;
  uint64 fee_basis_points = 4;
  uint64 fee_min_sats = 5;
}

message QueryShielderSessionRequest {
  string owner = 1;
  string height = 2;
}

message QueryShielderSessionResponse {
  string owner = 1;
  string deposit_address = 2;
  string vault_pub_key = 3;
  uint64 deposit_path_index = 4;
  string operator_pub_key = 5;
  string node_pub_key = 6;
  string auction_id = 7;
  int64 created_height = 8;
  string status = 9;
  string deposit_id = 10;
}

message QueryShielderBondRequest {
  string node_pub_key = 1;
  string height = 2;
}

message QueryShielderBondResponse {
  string node_pub_key = 1;
  string operator_pub_key = 2;
  string node_address = 3;
  uint64 slot = 4;
  uint64 pending_sats = 5;
  uint64 bond_sats = 6;
  uint64 fee_debt_sats = 7;
  bool fee_share_active = 8;
  string pending_fee_deposit_id = 9;
  bool sold = 10;
  string sold_auction_id = 11;
  int64 created_height = 12;
  int64 updated_height = 13;
  string node_status = 14;
  int64 slash_points = 15;
}

message QueryNodeSlotAuctionRequest {
  string auction_id = 1;
  string height = 2;
}

message QueryNodeSlotAuctionResponse {
  string auction_id = 1;
  string seller = 2;
  string seller_operator_pub_key = 3;
  string seller_node_pub_key = 4;
  uint64 slot = 5;
  uint64 original_bond_sats = 6;
  uint64 reserve_sats = 7;
  int64 expiry_height = 8;
  string selected_bid_id = 9;
  string status = 10;
  int64 created_height = 11;
  int64 updated_height = 12;
}

message QueryNodeSlotAuctionsRequest { string height = 1; }

message QueryNodeSlotAuctionsResponse {
  repeated QueryNodeSlotAuctionResponse auctions = 1;
}

message QueryNodeSlotBidRequest {
  string bid_id = 1;
  string height = 2;
}

message QueryNodeSlotBidResponse {
  string bid_id = 1;
  string auction_id = 2;
  string bidder = 3;
  string operator_pub_key = 4;
  string node_pub_key = 5;
  string deposit_id = 6;
  uint64 amount_sats = 7;
  bool selected = 8;
  bool settled = 9;
  int64 created_height = 10;
  int64 updated_height = 11;
}

message QueryNodeSlotAuctionBidsRequest {
  string auction_id = 1;
  string height = 2;
}

message QueryNodeSlotAuctionBidsResponse {
  repeated QueryNodeSlotBidResponse bids = 1;
}

message QueryVaultDepositAddressRequest {
  string address = 1;
  string height = 2;
}

message QueryVaultDepositAddressResponse {
  string address = 1;
  string vault_pub_key = 2;
  uint64 path_index = 3;
  string owner = 4;
  string operator_pub_key = 5;
  string node_pub_key = 6;
  string auction_id = 7;
  int64 created_height = 8;
}

message QueryShielderFeeEntitlementRequest {
  string node_pub_key = 1;
  string height = 2;
}

message QueryShielderFeeEntitlementResponse {
  string node_pub_key = 1;
  uint64 claimable_sats = 2;
  uint64 accrued_sats = 3;
  uint64 fee_debt_sats = 4;
  uint64 fee_per_slot_share = 5;
  bool fee_share_active = 6;
  string pending_fee_deposit_id = 7;
}

message QueryShielderFeeEntitlementsRequest { string height = 1; }

message QueryShielderFeeEntitlementsResponse {
  repeated QueryShielderFeeEntitlementResponse entitlements = 1;
}
