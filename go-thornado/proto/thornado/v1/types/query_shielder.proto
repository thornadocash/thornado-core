syntax = "proto3";
package types;

option go_package = "github.com/thornadocash/go-thornado/x/thornado/types";

import "types/query_deposit.proto";

message QueryShielderRedeemRequest {
  string withdrawal_id = 1;
  string height = 2;
}

message QueryShielderRedeemResponse {
  string withdrawal_id = 1;
  string nullifier_hash = 2;
  string merkle_root = 3;
  string recipient = 4;
  uint64 amount_sats = 5;
  uint64 fee_sats = 6;
  string in_hash = 7;
  string vault_pub_key = 8;
  int64 requested_height = 9;
  string status = 10;
}

message QueryShielderNullifierRequest {
  string nullifier_hash = 1;
  string height = 2;
}

message QueryShielderNullifierResponse {
  string nullifier_hash = 1;
  bool spent = 2;
  string withdrawal_id = 3;
}

message ShielderNoteRecord {
  string commitment = 1;
  uint64 denomination_sats = 2;
}

message ShielderSpentNullifier {
  string nullifier_hash = 1;
  string withdrawal_id = 2;
}

message QueryShielderSyncRequest {
  string height = 1;
  uint64 limit = 2;
  string deposit_cursor = 3;
  string note_cursor = 4;
  string nullifier_cursor = 5;
}

message QueryShielderSyncResponse {
  repeated ShielderNoteRecord notes = 1;
  repeated ShielderSpentNullifier nullifiers = 2;
  repeated QueryDepositResponse deposits = 3;
  string next_deposit_cursor = 4;
  string next_note_cursor = 5;
  string next_nullifier_cursor = 6;
  bool has_more = 7;
  uint64 total_deposits = 8;
  uint64 total_notes = 9;
  uint64 total_nullifiers = 10;
}

message QueryShielderRedeemQuoteRequest {
  uint64 amount_sats = 1;
  string height = 2;
}

message QueryShielderRedeemQuoteResponse {
  uint64 amount_sats = 1;
  uint64 fee_sats = 2;
  uint64 net_sats = 3;
  uint64 fee_basis_points = 4;
  uint64 fee_min_sats = 5;
}
