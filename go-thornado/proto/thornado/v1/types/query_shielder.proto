syntax = "proto3";
package types;

option go_package = "github.com/thornadocash/go-thornado/x/thornado/types";

message QueryShielderRedeemRequest {
  string withdrawal_id = 1;
  string height = 2;
}

message QueryShielderRedeemResponse {
  string withdrawal_id = 1;
  string owner = 2;
  string nullifier_hash = 3;
  string merkle_root = 4;
  string recipient = 5;
  uint64 amount_sats = 6;
  uint64 fee_sats = 7;
  string in_hash = 8;
  string vault_pub_key = 9;
  int64 requested_height = 10;
  string status = 11;
}

message QueryShielderNullifierRequest {
  string nullifier_hash = 1;
  string height = 2;
}

message QueryShielderNullifierResponse {
  string nullifier_hash = 1;
  bool spent = 2;
  string withdrawal_id = 3;
}

message ShielderNoteRecord {
  string owner_pubkey = 1;
  string commitment = 2;
  uint64 denomination_sats = 3;
  string deposit_id = 4;
}

message ShielderSpentNullifier {
  string nullifier_hash = 1;
  string withdrawal_id = 2;
}

message QueryShielderSyncRequest { string height = 1; }

message QueryShielderSyncResponse {
  repeated ShielderNoteRecord notes = 1;
  repeated ShielderSpentNullifier nullifiers = 2;
}

message ShielderRoot {
  uint64 denomination_sats = 1;
  string root = 2;
  uint64 leaf_count = 3;
}

message QueryShielderRootsRequest { string height = 1; }

message QueryShielderRootsResponse { repeated ShielderRoot roots = 1; }

message QueryShielderLeavesRequest {
  uint64 denomination_sats = 1;
  string height = 2;
}

message QueryShielderLeavesResponse {
  uint64 denomination_sats = 1;
  uint64 leaf_count = 2;
  repeated string leaves = 3;
}

message QueryShielderRedeemQuoteRequest {
  uint64 amount_sats = 1;
  string height = 2;
}

message QueryShielderRedeemQuoteResponse {
  uint64 amount_sats = 1;
  uint64 fee_sats = 2;
  uint64 net_sats = 3;
  uint64 fee_basis_points = 4;
  uint64 fee_min_sats = 5;
}
