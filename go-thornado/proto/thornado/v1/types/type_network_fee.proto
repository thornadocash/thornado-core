syntax = "proto3";
package types;

option go_package = "github.com/thornadocash/go-thornado/x/thornado/types";

import "gogoproto/gogo.proto";

// NetworkFee represents the fee rate and typical outbound transaction size.
// Some chains may have simplifid usage to report the fee as the "fee_rate" and
// set size to 1.
message NetworkFee {
  string chain = 1 [ (gogoproto.casttype) =
                         "github.com/thornadocash/go-thornado/common.Chain" ];
  uint64 transaction_size = 2;
  uint64 transaction_fee_rate = 3;
}
