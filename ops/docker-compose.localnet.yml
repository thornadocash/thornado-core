name: thornado-localnet

# Current localnet shape. go-thornado is the only Go tree; Bifrost lives inside
# it, and Shielder is currently a Rust library wrapped from Go rather than a
# separate service.

x-common-env: &common-env
  THORNADO_LOCALNET: "1"
  RUST_LOG: ${RUST_LOG:-info}

x-bitcoin-env: &bitcoin-env
  BITCOIN_NETWORK: regtest
  BITCOIN_RPC_HOST: bitcoind-regtest
  BITCOIN_RPC_PORT: "18443"
  BITCOIN_RPC_USER: ${BITCOIN_RPC_USER:-thornado}
  BITCOIN_RPC_PASSWORD: ${BITCOIN_RPC_PASSWORD:-thornado}

services:
  bitcoind-regtest:
    image: ${BITCOIND_IMAGE:-bitcoin/bitcoin:27}
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0001
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=${BITCOIN_RPC_USER:-thornado}
      - -rpcpassword=${BITCOIN_RPC_PASSWORD:-thornado}
    ports:
      - "18443:18443"
      - "18444:18444"
    volumes:
      - thornado-bitcoin:/home/bitcoin/.bitcoin
      - ./logs/bitcoind:/logs
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -regtest -rpcuser=$${BITCOIN_RPC_USER:-thornado} -rpcpassword=$${BITCOIN_RPC_PASSWORD:-thornado} getblockchaininfo >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30

  thornado-1:
    profiles: ["mock"]
    build:
      context: ./mock-service
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      MOCK_SERVICE_NAME: thornado-1
      MOCK_PORTS: "26656,26657,1317,9090"
      THORNADO_MONIKER: thornado-1
      THORNADO_HOME: /var/lib/thornado/thornado
    depends_on:
      bitcoind-regtest:
        condition: service_healthy
    ports:
      - "26656:26656"
      - "26657:26657"
      - "1317:1317"
      - "9090:9090"
    volumes:
      - thornado-thornado-1:/var/lib/thornado/thornado
      - ./logs/thornado-1:/logs

  thornado-2:
    profiles: ["three-node"]
    build:
      context: ./mock-service
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      MOCK_SERVICE_NAME: thornado-2
      MOCK_PORTS: "26656,26657,1317,9090"
      THORNADO_MONIKER: thornado-2
      THORNADO_HOME: /var/lib/thornado/thornado
    ports:
      - "26756:26656"
      - "26757:26657"
      - "1318:1317"
      - "9091:9090"
    volumes:
      - thornado-thornado-2:/var/lib/thornado/thornado
      - ./logs/thornado-2:/logs

  thornado-3:
    profiles: ["three-node"]
    build:
      context: ./mock-service
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      MOCK_SERVICE_NAME: thornado-3
      MOCK_PORTS: "26656,26657,1317,9090"
      THORNADO_MONIKER: thornado-3
      THORNADO_HOME: /var/lib/thornado/thornado
    ports:
      - "26856:26656"
      - "26857:26657"
      - "1319:1317"
      - "9092:9090"
    volumes:
      - thornado-thornado-3:/var/lib/thornado/thornado
      - ./logs/thornado-3:/logs

  bifrost-1:
    profiles: ["mock"]
    build:
      context: ./mock-service
      dockerfile: Dockerfile
    environment:
      <<: [*common-env, *bitcoin-env]
      MOCK_SERVICE_NAME: bifrost-1
      MOCK_PORTS: "6040"
      BIFROST_NODE_ID: bifrost-1
      BIFROST_HOME: /var/lib/thornado/bifrost
      THORNADO_ENDPOINT: http://thornado-1:1317
      THORNADO_GRPC_ENDPOINT: thornado-1:9090
    depends_on:
      bitcoind-regtest:
        condition: service_healthy
      thornado-1:
        condition: service_started
    ports:
      - "6040:6040"
    volumes:
      - thornado-bifrost-1:/var/lib/thornado/bifrost
      - ./logs/bifrost-1:/logs

  bifrost-2:
    profiles: ["three-node"]
    build:
      context: ./mock-service
      dockerfile: Dockerfile
    environment:
      <<: [*common-env, *bitcoin-env]
      MOCK_SERVICE_NAME: bifrost-2
      MOCK_PORTS: "6040"
      BIFROST_NODE_ID: bifrost-2
      BIFROST_HOME: /var/lib/thornado/bifrost
      THORNADO_ENDPOINT: http://thornado-2:1317
      THORNADO_GRPC_ENDPOINT: thornado-2:9090
    depends_on:
      thornado-2:
        condition: service_started
    ports:
      - "6041:6040"
    volumes:
      - thornado-bifrost-2:/var/lib/thornado/bifrost
      - ./logs/bifrost-2:/logs

  bifrost-3:
    profiles: ["three-node"]
    build:
      context: ./mock-service
      dockerfile: Dockerfile
    environment:
      <<: [*common-env, *bitcoin-env]
      MOCK_SERVICE_NAME: bifrost-3
      MOCK_PORTS: "6040"
      BIFROST_NODE_ID: bifrost-3
      BIFROST_HOME: /var/lib/thornado/bifrost
      THORNADO_ENDPOINT: http://thornado-3:1317
      THORNADO_GRPC_ENDPOINT: thornado-3:9090
    depends_on:
      thornado-3:
        condition: service_started
    ports:
      - "6042:6040"
    volumes:
      - thornado-bifrost-3:/var/lib/thornado/bifrost
      - ./logs/bifrost-3:/logs

  client:
    profiles: ["client"]
    image: ${CLIENT_IMAGE:-alpine:3.20}
    working_dir: /workspace
    environment:
      <<: [*common-env, *bitcoin-env]
      THORNADO_ENDPOINT: http://thornado-1:1317
      THORNADO_GRPC_ENDPOINT: thornado-1:9090
    volumes:
      - ..:/workspace
      - ./logs/client:/logs
    command: ["sh", "-lc", "sleep infinity"]

volumes:
  thornado-bitcoin:
  thornado-thornado-1:
  thornado-thornado-2:
  thornado-thornado-3:
  thornado-bifrost-1:
  thornado-bifrost-2:
  thornado-bifrost-3:
